<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teaspill — Coming Soon</title>
  <meta name="description" content="The UK's first dedicated reviews platform for Black hair and beauty. Coming soon." />
  <meta property="og:title" content="Teaspill — Coming Soon" />
  <meta property="og:description" content="The UK's first dedicated reviews platform for Black hair and beauty." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://teaspill.co.uk" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400;1,500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #1A1008;
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 24px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .eyebrow {
      font-size: 9px;
      letter-spacing: 4px;
      color: #DBA99A;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .wordmark {
      font-family: 'Lora', Georgia, serif;
      font-style: italic;
      font-size: clamp(42px, 10vw, 56px);
      font-weight: 400;
      line-height: 1.05;
      margin-bottom: 0;
    }

    .wordmark-tea { color: #FDF8F5; }
    .wordmark-spill { color: #DBA99A; }

    .divider {
      width: 32px;
      height: 1px;
      background: #DBA99A;
      opacity: 0.4;
      margin: 22px auto;
    }

    .tagline {
      font-size: 9px;
      letter-spacing: 3px;
      color: #DBA99A;
      opacity: 0.65;
      text-transform: uppercase;
      margin-bottom: 40px;
    }

    .body-text {
      font-family: 'Lora', Georgia, serif;
      font-style: italic;
      font-size: 15px;
      color: #FDF8F5;
      opacity: 0.55;
      line-height: 1.8;
      margin-bottom: 36px;
    }

    .form-row {
      display: flex;
      width: 100%;
      border: 1px solid rgba(219, 169, 154, 0.3);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .form-row input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 12px 16px;
      color: #FDF8F5;
      font-size: 13px;
      font-family: Arial, sans-serif;
      outline: none;
    }

    .form-row input::placeholder {
      color: rgba(253, 248, 245, 0.35);
    }

    .form-row button {
      background: #DBA99A;
      border: none;
      padding: 12px 20px;
      font-size: 11px;
      font-weight: 700;
      color: #1A1008;
      cursor: pointer;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-family: Arial, sans-serif;
      white-space: nowrap;
      transition: opacity 0.15s;
    }

    .form-row button:hover { opacity: 0.88; }

    .success-msg {
      display: none;
      font-family: 'Lora', Georgia, serif;
      font-style: italic;
      font-size: 14px;
      color: #DBA99A;
      line-height: 1.7;
      padding: 12px 0;
    }

    .footer {
      font-size: 9px;
      color: #DBA99A;
      opacity: 0.4;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .footer a {
      color: inherit;
      text-decoration: none;
    }

    .footer a:hover { opacity: 0.7; }
  </style>
</head>
<body>
  <div class="container">

    <p class="eyebrow">Coming soon</p>

    <h1 class="wordmark">
      <span class="wordmark-tea">Tea</span><span class="wordmark-spill">spill</span>
    </h1>

    <div class="divider"></div>

    <p class="tagline">Black beauty · Honestly reviewed</p>

    <p class="body-text">
      The UK's first dedicated reviews platform<br/>
      for Black hair &amp; beauty.
    </p>

    <p style="font-family:'Lora',Georgia,serif; font-style:italic; font-size:clamp(22px,5vw,28px); font-weight:400; color:#DBA99A; letter-spacing:-0.3px; line-height:1.2; margin-bottom:36px;">
      No more bad chair days!
    </p>

    <div class="form-row" id="form-row">
      <input type="email" id="email-input" placeholder="Your email address" autocomplete="email" />
      <button onclick="handleSubmit()">Notify me</button>
    </div>

    <p class="success-msg" id="success-msg">
      You're on the list. We'll be in touch.
    </p>

    <p class="footer">
      <a href="https://instagram.com/teaspill_uk" target="_blank">@teaspill_uk</a>
      &nbsp;·&nbsp;
      <a href="mailto:hello@teaspill.co.uk">hello@teaspill.co.uk</a>
      &nbsp;·&nbsp;
      &copy; 2026
    </p>

  </div>

  <script>
    function handleSubmit() {
      var email = document.getElementById('email-input').value.trim()
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        document.getElementById('email-input').style.borderBottom = '1px solid #c0392b'
        return
      }

      // Replace this fetch with your actual email capture endpoint (Mailchimp, Klaviyo, etc.)
      fetch('https://formspree.io/f/YOUR_FORM_ID', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email })
      }).catch(function() {})

      document.getElementById('form-row').style.display = 'none'
      document.getElementById('success-msg').style.display = 'block'
    }

    document.getElementById('email-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') handleSubmit()
    })
  </script>

</body>
</html>
